name: PR note
description: Post a harmless thank-you note on a pull request comment.
inputs:
  token:
    description: Token with permission to comment on the pull request.
    required: true
  body:
    description: Comment to post.
    default: Thanks for the pull request!
outputs:
  demo-revision:
    description: Benign demo revision marker.
    value: IMPOSTER
runs:
  using: composite
  steps:
    - name: IMPOSTER pr-note commit
      shell: bash
      run: |
        echo "::warning title=IMPOSTER pr-note commit ran::This commit lives only in a fork (nodeselector/pr-note), not in Steve-Glass/pr-note history."
        echo "## 🚨 IMPOSTER pr-note commit ran (fork network, not upstream)" >> "$GITHUB_STEP_SUMMARY"
